name: Journal quotidien

on:
  schedule:
    # 05:00 Paris, ete comme hiver. Le declenchement ESP32 evite les retards du cron.
    - cron: '0 5 * * *'
      timezone: 'Europe/Paris'
    # Rattrapages : aucune requete IA une fois l'edition du jour publiee.
    - cron: '17,47 5-12 * * *'
      timezone: 'Europe/Paris'
  workflow_dispatch:
    inputs:
      force:
        description: 'Régénérer même si une édition existe déjà aujourd’hui'
        type: boolean
        default: false

      publish:
        description: 'Publier pour impression (décocher pour tester seulement)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: journal-quotidien
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Vérifier si une édition est nécessaire
        id: gate
        env:
          FORCE: ${{ (inputs.force || (github.event_name == 'workflow_dispatch' && inputs.publish == false)) && 'true' || 'false' }}
        run: |
          due="$(python -m scripts.is_due)"
          echo "due=$due" >> "$GITHUB_OUTPUT"
      - name: Installer les dépendances
        if: steps.gate.outputs.due == 'true'
        run: python -m pip install -r requirements.txt
      - name: Générer le journal
        timeout-minutes: 9
        if: steps.gate.outputs.due == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JOURNAL_GREETING: ${{ vars.JOURNAL_GREETING }}
        run: python -m mini_journal
      - name: Conserver l’aperçu pour diagnostic
        if: always() && steps.gate.outputs.due == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: journal-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
          retention-days: 3
      - name: Publier sur la branche journal
        if: steps.gate.outputs.due == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.publish
      - name: Résumé
        env:
          DUE: ${{ steps.gate.outputs.due }}
          PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: |
          if [ "$DUE" = "true" ]; then
            python -c "import json; print('Sélection : ' + json.load(open('out/edition.json'))['provider'])" >> "$GITHUB_STEP_SUMMARY"
            echo "Journal généré. Publication : $PUBLISH. Aperçu disponible dans les artifacts." >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Une édition existe déjà pour cette date : aucune nouvelle requête IA.' >> "$GITHUB_STEP_SUMMARY"
          fi
