name: Vérifications

on:
  push:
    branches-ignore: [journal]
  pull_request:
    branches-ignore: [journal]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Vérifier les événements Bluetooth sans matériel
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Ifirmware/include tests/transport_state_test.cpp -o /tmp/transport-state-test
          /tmp/transport-state-test
      - run: python -m mini_journal --demo
      - run: pio run -d firmware
      - run: pio run -d firmware -t buildfs
      - uses: actions/upload-artifact@v7
        with:
          name: exemple-fictif
          path: out/preview.png
          retention-days: 3
