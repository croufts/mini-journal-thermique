name: Vérifications

on:
  push:
    branches-ignore: [journal]
  pull_request:
    branches-ignore: [journal]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m mini_journal --demo
      - run: pio run -d firmware
      - run: pio run -d firmware -t buildfs
      - uses: actions/upload-artifact@v4
        with:
          name: exemple-fictif
          path: out/preview.png
          retention-days: 3
