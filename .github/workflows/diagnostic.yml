name: Diagnostic OpenRouter
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Comparaison simple ou chaine complete avec relecture'
        type: choice
        options: [production, baseline]
        default: production
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Comparer les requetes sans publier ni imprimer
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DIAGNOSTIC_MODE: ${{ inputs.mode }}
        run: |
          python -u - <<'PY'
          import json, os, re
          from datetime import datetime, timezone
          import requests
          from mini_journal.ai import SYSTEM, response_schema, parse_json, validate
          from mini_journal.feeds import collect
          key = os.environ.get("OPENROUTER_API_KEY", "").strip()
          if not key:
              raise SystemExit("Secret OPENROUTER_API_KEY absent")
          def safe(value):
              text = str(value).replace(key, "[REDACTED]")
              return re.sub(r"(?:sk-or-v1-|Bearer\s+)[A-Za-z0-9_-]+", "[REDACTED]", text)[:1600]
          config = json.load(open("config.json", encoding="utf-8"))
          candidates = collect(config, datetime.now(timezone.utc))
          base = {"model": "openrouter/free", "temperature": .2, "max_tokens": 6000,
                  "messages": [{"role": "system", "content": SYSTEM},
                               {"role": "user", "content": json.dumps(candidates, ensure_ascii=False)}]}
          probes = [("minimal", {"model": "openrouter/free", "max_tokens": 128,
                      "messages": [{"role": "user", "content": 'Return only JSON: {"ok":true}'}]}),
                    ("journal_strict", dict(base, response_format=response_schema(candidates),
                      provider={"require_parameters": True}, reasoning={"enabled": False})),
                    ("journal_json", dict(base, response_format={"type": "json_object"}))]
          for label, payload in (probes if os.environ.get("DIAGNOSTIC_MODE") == "baseline" else []):
              print("PROBE", label, flush=True)
              try:
                  r = requests.post("https://openrouter.ai/api/v1/chat/completions", json=payload,
                      headers={"Authorization": "Bearer " + key}, timeout=(10,90))
                  print("HTTP", r.status_code, flush=True)
                  data = r.json()
                  if "error" in data:
                      error = data["error"]
                      print("ERROR", safe(error.get("code")), safe(error.get("message")), flush=True)
                      metadata = error.get("metadata", {})
                      for field in ("provider_name", "raw"):
                          if field in metadata: print(field, safe(metadata[field]), flush=True)
                      continue
                  choice = data["choices"][0]
                  content = choice["message"].get("content")
                  print("MODEL", safe(data.get("model")), "FINISH", choice.get("finish_reason"),
                        "USAGE", safe(data.get("usage")), flush=True)
                  print("CONTENT", safe(content), flush=True)
                  try:
                      parsed = parse_json(content)
                      if label != "minimal": validate(parsed, candidates)
                      print("VALIDATION OK", flush=True)
                  except (ValueError, TypeError) as exc:
                      print("VALIDATION", type(exc).__name__, safe(str(exc)), flush=True)
              except requests.RequestException as exc:
                  print("NETWORK", type(exc).__name__, flush=True)
          if os.environ.get("DIAGNOSTIC_MODE") != "baseline":
              import logging
              from mini_journal.ai import select
              logging.basicConfig(level=logging.INFO)
              original_post = requests.post
              def observed_post(*args, **kwargs):
                  response = original_post(*args, **kwargs)
                  print("PRODUCTION HTTP", response.status_code, flush=True)
                  try:
                      data = response.json()
                      if "error" in data:
                          print("PRODUCTION ERROR", safe(data["error"]), flush=True)
                      else:
                          choice = data["choices"][0]
                          print("PRODUCTION MODEL", safe(data.get("model")), "FINISH", choice.get("finish_reason"), flush=True)
                          content = choice["message"].get("content")
                          if isinstance(content, str):
                              try:
                                  parsed = parse_json(content)
                                  print("PRODUCTION TITLES", safe([a["title"] for section in parsed.values() for a in section]), flush=True)
                              except (ValueError, TypeError, KeyError):
                                  print("PRODUCTION NON_JSON", safe(content), flush=True)
                  except (ValueError, KeyError, IndexError):
                      print("PRODUCTION response not in expected envelope", flush=True)
                  return response
              requests.post = observed_post
              config["allow_rss_fallback"] = False
              articles, provider = select(candidates, config)
              print("PRODUCTION SUCCESS", provider, sum(len(a) for a in articles.values()), flush=True)
          PY
